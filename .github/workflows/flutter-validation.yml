name: Flutter validation

on:
  push:
    branches:
      - work/jokbo-update-20261024
  pull_request:
  workflow_dispatch:

# 연속 커밋 시 이전 브랜치 검증을 중단하고 최신 코드만 검증합니다.
concurrency:
  group: flutter-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build browser application
        run: flutter build web --release --no-wasm-dry-run --no-web-resources-cdn

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: genealogy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
