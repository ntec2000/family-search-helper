name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write    # release 생성 권한

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build Release APK (universal)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Verify ML Kit native libs are 16KB-aligned
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "Inspecting $APK"
          ZA=$(ls $ANDROID_HOME/build-tools/35.0.0/zipalign)
          "$ZA" -c -P 16 -v 4 "$APK" >/dev/null && echo "zipalign -P 16: PASS (16KB page aligned)"
          mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
          unzip -o "$GITHUB_WORKSPACE/$APK" "lib/arm64-v8a/libmlkit_google_ocr_pipeline.so" >/dev/null
          ALIGN=$(readelf -lW lib/arm64-v8a/libmlkit_google_ocr_pipeline.so | awk '/LOAD/{print $NF}' | sort -u | head -1)
          echo "libmlkit_google_ocr_pipeline.so LOAD alignment = $ALIGN"
          case "$ALIGN" in
            0x4000|0x10000) echo "OCR native lib is >=16KB aligned — OK" ;;
            *) echo "ERROR: ML Kit native lib NOT 16KB aligned ($ALIGN)"; exit 1 ;;
          esac

      - name: Rename APKs for distribution
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/family-search-helper-v1.0.6-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/family-search-helper-v1.0.6-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/family-search-helper-v1.0.6-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/family-search-helper-v1.0.6-x86_64.apk
          ls -lh dist/

      - name: Upload Universal APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: family-search-helper-universal-apk
          path: dist/family-search-helper-v1.0.6-universal.apk
          retention-days: 90

      - name: Upload Split APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: family-search-helper-split-apks
          path: dist/family-search-helper-v1.0.6-arm64.apk
          retention-days: 90

      - name: Publish Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "가족역사기록 도우미 v1.0.6"
          body: |
            # 가족역사기록 도우미 (Family Search Helper) v1.0.6

            **개발자**: Peter S. Choi
            **문의**: ntec21c@gmail.com

            ## 다운로드
            - **family-search-helper-v1.0.6-universal.apk** (~80MB, 모든 기기 호환 — 권장)
            - **family-search-helper-v1.0.6-arm64.apk** (~55MB, 최신 폰 전용, 권장)
            - **family-search-helper-v1.0.6-arm32.apk** (구형 폰)
            - **family-search-helper-v1.0.6-x86_64.apk** (에뮬레이터용)

            ## 설치
            1. APK 파일을 전화기로 전송 (이메일/카카오톡/USB 등)
            2. 설정 → 보안 → "출처를 알 수 없는 앱 설치 허용"
            3. APK 파일을 탭하여 설치

            ## 기능
            - 족보 한자 OCR (온디바이스, 무료)
            - 한자→한글 음 사전 8,528자 내장
            - 만세력 양↔음력, 干支 추정
            - 인물 카드 + 가계도 시각화
            - SQLite 로컬 저장
            - **작동 모드 선택** (설정에서 전환)
              - 추출 전용 모드: 정보 추출 후 GEDCOM·텍스트 내보내기 (로그인 불필요)
              - FamilySearch 연동 모드: 로그인 후 가계도에 인물 직접 등록 (Client ID 입력 시)
            - GEDCOM 5.5.1 내보내기 / FamilySearch OAuth 직접 동기화
            - 전통 한지·먹 테마

            ## v1.0.6 변경사항 ([한자 인식 시작] 강제 종료 — 진짜 원인 해결)
            - **근본 원인**: 한자(중국어) OCR 모델이 APK 안에 들어있지 않았음. ML Kit Flutter 플러그인은 한자 모듈을 `compileOnly`(컴파일만, APK 미포함)로만 선언하므로, [한자 인식 시작] 실행 순간 존재하지 않는 네이티브 코드를 호출 → Dart try/catch 로 잡히지 않는 **네이티브 강제 종료** 발생
            - **수정**: `com.google.mlkit:text-recognition-chinese:16.0.1`(번들 모델)을 앱 빌드에 `implementation` 으로 직접 추가 → 한자 OCR 모델·네이티브 라이브러리를 APK 에 포함, 완전 오프라인·온디바이스 동작 (Google Play 서비스 모델 다운로드 불필요)
            - 빌드 도구: Flutter 3.41 · AGP 8.9.1 · Gradle 8.11 · compileSdk 36 · NDK 27 · ML Kit 16.0.1(16KB 페이지 정렬)
            - **검증(배포 전 시뮬레이션)**: 빌드된 APK 내부에 한자 인식 모델(`Hani_ctc` conv/lstm 모델 + 한자 인식 엔진)이 실제로 포함됐음을 직접 확인 + 모든 .so 16KB 정렬(zipalign -P 16) 통과 확인
          files: |
            dist/family-search-helper-v1.0.6-universal.apk
            dist/family-search-helper-v1.0.6-arm64.apk
            dist/family-search-helper-v1.0.6-arm32.apk
            dist/family-search-helper-v1.0.6-x86_64.apk
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
