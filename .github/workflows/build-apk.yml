name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write    # release 생성 권한

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build Release APK (universal)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Verify ML Kit native libs are 16KB-aligned
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "Inspecting $APK"
          ZA=$(ls $ANDROID_HOME/build-tools/35.0.0/zipalign)
          "$ZA" -c -P 16 -v 4 "$APK" >/dev/null && echo "zipalign -P 16: PASS (16KB page aligned)"
          mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
          unzip -o "$GITHUB_WORKSPACE/$APK" "lib/arm64-v8a/libmlkit_google_ocr_pipeline.so" >/dev/null
          ALIGN=$(readelf -lW lib/arm64-v8a/libmlkit_google_ocr_pipeline.so | awk '/LOAD/{print $NF}' | sort -u | head -1)
          echo "libmlkit_google_ocr_pipeline.so LOAD alignment = $ALIGN"
          case "$ALIGN" in
            0x4000|0x10000) echo "OCR native lib is >=16KB aligned — OK" ;;
            *) echo "ERROR: ML Kit native lib NOT 16KB aligned ($ALIGN)"; exit 1 ;;
          esac

      - name: Rename APKs for distribution
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/family-search-helper-v2.6.0-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/family-search-helper-v2.6.0-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/family-search-helper-v2.6.0-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/family-search-helper-v2.6.0-x86_64.apk
          ls -lh dist/

      - name: Upload Universal APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: family-search-helper-universal-apk
          path: dist/family-search-helper-v2.6.0-universal.apk
          retention-days: 90

      - name: Upload Split APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: family-search-helper-split-apks
          path: dist/family-search-helper-v2.6.0-arm64.apk
          retention-days: 90

      - name: Publish Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0
          name: "가족역사기록 도우미 v2.6.0"
          body: |
            # 가족역사기록 도우미 (Family Search Helper) v2.6.0

            **개발자**: Peter S. Choi
            **문의**: ntec21c@gmail.com

            ## 다운로드
            - **family-search-helper-v2.6.0-universal.apk** (~80MB, 모든 기기 호환 — 권장)
            - **family-search-helper-v2.6.0-arm64.apk** (~55MB, 최신 폰 전용, 권장)
            - **family-search-helper-v2.6.0-arm32.apk** (구형 폰)
            - **family-search-helper-v2.6.0-x86_64.apk** (에뮬레이터용)

            ## 설치
            1. APK 파일을 전화기로 전송 (이메일/카카오톡/USB 등)
            2. 설정 → 보안 → "출처를 알 수 없는 앱 설치 허용"
            3. APK 파일을 탭하여 설치

            ## 기능
            - 족보 한자 OCR (온디바이스, 무료)
            - 한자→한글 음 사전 8,528자 내장
            - 만세력 양↔음력, 干支 추정
            - 인물 카드 + 가계도 시각화
            - SQLite 로컬 저장
            - **작동 모드 선택** (설정에서 전환)
              - 추출 전용 모드: 정보 추출 후 GEDCOM·텍스트 내보내기 (로그인 불필요)
              - FamilySearch 연동 모드: 로그인 후 가계도에 인물 직접 등록 (Client ID 입력 시)
            - GEDCOM 5.5.1 내보내기 / FamilySearch OAuth 직접 동기화
            - 전통 한지·먹 테마

            ## v2.6.0 변경사항 (완전 종료·새로고침 전체 클리어·한자도구 통합검색·필기 개선·가족관계 표시·성씨 수동입력)
            - 🛠 **[앱 종료] 백그라운드 잔존 완전 해결** — 네이티브에서 태스크까지 제거하고 프로세스를 즉시 종료
            - 🛠 **[초기화면으로 새로고침] = 등록된 인물 전체 클리어** — 확인 후 모든 데이터를 비우고 처음 입력받는 상태로 복귀
            - ✨ **한자 도구 [통합 검색]** — [이름 찾기] + [한자음 검색] 통합, 한글(이름·단어)을 넣으면 음절별 한자음을 모두 표시 (예: 후기성도 → 후/기/성/도)
            - ✨ **필기 인식 개선** — 획을 더 가늘게(부드러운 곡선 보간) 표시하고 고해상도 캡처로 인식 정확도 향상
            - ✨ **인식 결과에 아버지와의 가족관계 표시** — 첫째아들·둘째아들·첫째딸·둘째딸 등을 태그로 표기
            - ✨ **결과 화면에서 성씨 수동 입력** — 성을 알 수 없으면 한글 성 입력 → [입력] → 한자 후보 선택 → 한글+한자 성을 족보 기본 성으로 삼아 자녀 이름을 '성+이름'으로 표시

            ## v2.5.0 변경사항 (이름·신상정보 최우선·차례 인식·처가 정리·만세력 한글·앱 공유·종료/새로고침 수정)
            - ✨ **이름·신상정보 추출 최우선** — 字(자)는 본명이 아닌 '관례 때 받은 이름'으로 메모에 별도 표기
            - ✨ **아들/딸 차례 자동 인식** — 二子·三子·四子 등 한자 숫자로 '둘째 아들'처럼 순서를 메모에 기록 (장남은 숫자 없이 처음 등장)
            - ✨ **配(아내) 처가 직계 정리** — 父=장인·祖=처조·曾祖=처증조에 아내 성씨를 붙이고 관직(判官)·품계(通政)는 제거, 同知는 이름(변동지)으로 유지
            - ✨ **外祖(아내 외조부)는 본관(앞 지역) 제거 후 자체 성씨** — 文化柳承春→류승춘, 濟州高→고씨
            - ✨ **만세력 변환 결과를 한글(세차·월건·일진·띠 등)로 표시**
            - ✨ **[앱 공유] 기능 추가** — 앱 소개·배포처를 공유 시트로 전달
            - 🛠 **[새로고침]** 이 열려 있던 모든 화면을 닫고 초기(디폴트) 화면으로 복귀
            - 🛠 **[앱 종료]** 가 화면만 사라지고 백그라운드에 남던 문제 수정 — 프로세스 완전 종료
            - 🛠 한자 필기 인식 획 굵기를 가늘게 조정
            - 🛠 앱 정보 타이틀(家族歷史記錄 助手) 한 줄 표시

            ## v2.4.0 변경사항 (인물 아님 삭제·女 인식 정교화·出系 인식·이름 규칙 체계화)
            - ✨ **인식 후 사람 이름이 아닌 항목 삭제 버튼** — 오인식·관직명 등을 🗑 로 제거하여 인물만 정리
            - ✨ **女(딸) 인식 정교화** — 사위 이름과 본관(○○人) 분리 추출, 본관만 있으면 사위 '이름 미상', 딸 본인은 가문 성(○씨)
            - ✨ **出系(출계·양자) 자동 인식** — '出系 ○○后' 를 특이사항으로 기록 (예: 承勳·炳旭)
            - ✨ 이름 뒤 키워드 오인식 자동 보정(承勳出 → 承勳), 干支 내부 子 오분리 방지
            - ✨ 처가(配) 父/祖/曾祖/外祖 추출 안정화(관직명·본관 포함), 忌(연도 미상)·墓(좌향·합폄) 보강
            - ✨ 한글표기↔한자음 불일치 시 특이사항(확인요망) 메모 — 예: 聖甲(성갑)을 '성중'으로 오기
            - ✨ 내보내기·인물 목록에 특이사항(出系 등) 표시

            ## v2.3.0 변경사항 (처가 계열 귀속·딸=○씨·성씨 한자 선택·핀치 줌)
            - ✨ **配(배우자) 블록의 父/祖/曾祖/外祖를 처가(아내 쪽) 계열로 정확히 귀속** — 장인·처조·처증조·처외조로 분리 표기, 장인 등은 아내 본관 성씨 병기
            - ✨ **女(딸) = 사위(남편)로 인식**, 딸 본인은 이름이 없으므로 **아버지(가문) 성을 따라 '○씨'** 표기 · 사위 본관은 ○○人에서 추출
            - ✨ **성씨 미인식 시 한글 성 입력 → [입력] → 한자 후보에서 선택** → 선택한 한글+한자로 성씨 확정 후 전체 자녀 이름에 적용
            - ✨ **모든 이미지 화면(촬영 확인·결과)에 핀치 줌** — 첨부·촬영한 족보 이미지를 확대하여 읽기 가능
            - ✨ 干支生/干支卒(예: 壬辰生) 단순 표기 및 忌(기일·연도 미상)·墓(매장지) 인식 보강
            - ✨ **내보내기 텍스트를 FamilySearch 입력용 형식으로 정리** — 성/이름/로마자/字/출생/배우자·장인 등 처가 계열/사위/딸=○씨 포함

            ## v2.2.0 변경사항 (가계도·성씨 분리·세대 추정·FamilySearch 정합)
            - ✨ **가계도 전면 개선** — 아버지(중심) 기준 자녀를 아래에 선 연결, 장인 옆에 장모, 딸 아래 사위·사돈·사돈부인 표시
            - ✨ **아들 성|이름 두 칸 + 로마자 두 칸** 구분 표시, 딸(이름 없음) **'○씨' 한 칸** + 로마자 한 칸 (밑줄 구분은 칸 넓이만큼)
            - ✨ **성씨 상속** — 자식 이름만 있으면 아버지 성 적용, 인식 시 성씨 없으면 **수동 입력하여 전체 인물에 동일 적용**
            - ✨ 자녀 **출생연도순(첫째·둘째…) 정렬 · 아들/딸 구분**
            - ✨ **세대(世) 기반 출생연도 추정** (한 세대 ≈ 30년) — 추정 어려우면 '대략 ○○○○', 불가하면 공란
            - ✨ 출생·사망지 미상 시 기본 **'대한민국'** 표기 (한글·로마자 병기)
            - ✨ 인물카드에 **성(姓) 분리·장모·사돈부인·世·派·근거 진술(FamilySearch Reason)** 항목 추가
            - ✨ 인식 후 **인물 추가·수정** 가능 (입력항목 동일 · 로마자 자동 변환)
            - ✨ 가계도 박스 **탭 시 인물카드 이동** (이름→실제 레코드 자동 매칭)
            - ✨ 내보내기 텍스트에 **모든 인물 정보 포함** 및 칸 구분선 정리
            - **기반**: 한자 OCR 모델을 APK 에 번들(`text-recognition-chinese:16.0.1`) — 완전 오프라인·온디바이스
            - **검증(배포 전 시뮬레이션)**: 정적 분석 무오류 + 단위 테스트 통과 + 빌드 APK 내부 한자 인식 모델 포함 + 모든 arm64 .so 16KB 페이지 정렬 확인
          files: |
            dist/family-search-helper-v2.6.0-universal.apk
            dist/family-search-helper-v2.6.0-arm64.apk
            dist/family-search-helper-v2.6.0-arm32.apk
            dist/family-search-helper-v2.6.0-x86_64.apk
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
