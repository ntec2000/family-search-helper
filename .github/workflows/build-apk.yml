name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write    # release 생성 권한

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 platforms;android-36 build-tools;34.0.0 build-tools;35.0.0 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build Release APK (universal)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Verify ML Kit native libs are 16KB-aligned
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          echo "Inspecting $APK"
          ZA=$(ls $ANDROID_HOME/build-tools/35.0.0/zipalign)
          "$ZA" -c -P 16 -v 4 "$APK" >/dev/null && echo "zipalign -P 16: PASS (16KB page aligned)"
          mkdir -p /tmp/apkcheck && cd /tmp/apkcheck
          unzip -o "$GITHUB_WORKSPACE/$APK" "lib/arm64-v8a/libmlkit_google_ocr_pipeline.so" >/dev/null
          ALIGN=$(readelf -lW lib/arm64-v8a/libmlkit_google_ocr_pipeline.so | awk '/LOAD/{print $NF}' | sort -u | head -1)
          echo "libmlkit_google_ocr_pipeline.so LOAD alignment = $ALIGN"
          case "$ALIGN" in
            0x4000|0x10000) echo "OCR native lib is >=16KB aligned — OK" ;;
            *) echo "ERROR: ML Kit native lib NOT 16KB aligned ($ALIGN)"; exit 1 ;;
          esac

      - name: Rename APKs for distribution
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/family-search-helper-v2.2.0-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/family-search-helper-v2.2.0-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/family-search-helper-v2.2.0-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/family-search-helper-v2.2.0-x86_64.apk
          ls -lh dist/

      - name: Upload Universal APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: family-search-helper-universal-apk
          path: dist/family-search-helper-v2.2.0-universal.apk
          retention-days: 90

      - name: Upload Split APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: family-search-helper-split-apks
          path: dist/family-search-helper-v2.2.0-arm64.apk
          retention-days: 90

      - name: Publish Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "가족역사기록 도우미 v2.2.0"
          body: |
            # 가족역사기록 도우미 (Family Search Helper) v2.2.0

            **개발자**: Peter S. Choi
            **문의**: ntec21c@gmail.com

            ## 다운로드
            - **family-search-helper-v2.2.0-universal.apk** (~80MB, 모든 기기 호환 — 권장)
            - **family-search-helper-v2.2.0-arm64.apk** (~55MB, 최신 폰 전용, 권장)
            - **family-search-helper-v2.2.0-arm32.apk** (구형 폰)
            - **family-search-helper-v2.2.0-x86_64.apk** (에뮬레이터용)

            ## 설치
            1. APK 파일을 전화기로 전송 (이메일/카카오톡/USB 등)
            2. 설정 → 보안 → "출처를 알 수 없는 앱 설치 허용"
            3. APK 파일을 탭하여 설치

            ## 기능
            - 족보 한자 OCR (온디바이스, 무료)
            - 한자→한글 음 사전 8,528자 내장
            - 만세력 양↔음력, 干支 추정
            - 인물 카드 + 가계도 시각화
            - SQLite 로컬 저장
            - **작동 모드 선택** (설정에서 전환)
              - 추출 전용 모드: 정보 추출 후 GEDCOM·텍스트 내보내기 (로그인 불필요)
              - FamilySearch 연동 모드: 로그인 후 가계도에 인물 직접 등록 (Client ID 입력 시)
            - GEDCOM 5.5.1 내보내기 / FamilySearch OAuth 직접 동기화
            - 전통 한지·먹 테마

            ## v2.2.0 변경사항 (가계도·성씨 분리·세대 추정·FamilySearch 정합)
            - ✨ **가계도 전면 개선** — 아버지(중심) 기준 자녀를 아래에 선 연결, 장인 옆에 장모, 딸 아래 사위·사돈·사돈부인 표시
            - ✨ **아들 성|이름 두 칸 + 로마자 두 칸** 구분 표시, 딸(이름 없음) **'○씨' 한 칸** + 로마자 한 칸 (밑줄 구분은 칸 넓이만큼)
            - ✨ **성씨 상속** — 자식 이름만 있으면 아버지 성 적용, 인식 시 성씨 없으면 **수동 입력하여 전체 인물에 동일 적용**
            - ✨ 자녀 **출생연도순(첫째·둘째…) 정렬 · 아들/딸 구분**
            - ✨ **세대(世) 기반 출생연도 추정** (한 세대 ≈ 30년) — 추정 어려우면 '대략 ○○○○', 불가하면 공란
            - ✨ 출생·사망지 미상 시 기본 **'대한민국'** 표기 (한글·로마자 병기)
            - ✨ 인물카드에 **성(姓) 분리·장모·사돈부인·世·派·근거 진술(FamilySearch Reason)** 항목 추가
            - ✨ 인식 후 **인물 추가·수정** 가능 (입력항목 동일 · 로마자 자동 변환)
            - ✨ 가계도 박스 **탭 시 인물카드 이동** (이름→실제 레코드 자동 매칭)
            - ✨ 내보내기 텍스트에 **모든 인물 정보 포함** 및 칸 구분선 정리
            - **기반**: 한자 OCR 모델을 APK 에 번들(`text-recognition-chinese:16.0.1`) — 완전 오프라인·온디바이스
            - **검증(배포 전 시뮬레이션)**: 정적 분석 무오류 + 단위 테스트 통과 + 빌드 APK 내부 한자 인식 모델 포함 + 모든 arm64 .so 16KB 페이지 정렬 확인
          files: |
            dist/family-search-helper-v2.2.0-universal.apk
            dist/family-search-helper-v2.2.0-arm64.apk
            dist/family-search-helper-v2.2.0-arm32.apk
            dist/family-search-helper-v2.2.0-x86_64.apk
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
