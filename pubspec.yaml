name: family_search_helper
description: "가족역사기록 도우미 - 족보 한자 인식 및 가족역사기록서 작성 보조 앱"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.2.0
  # ML Kit - compileSdk=34 호환 버전
  google_mlkit_text_recognition: 0.13.0
  flutter_plugin_android_lifecycle: 2.0.20
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  lunar: ^1.6.18
  intl: ^0.19.0
  uuid: ^4.5.0
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  collection: ^1.18.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dict/
